base: split1_warmup.yaml

experiment:
  name: rfdetr_2xlarge_sam_h_ugca_v3_split1
  status: formal_frozen

loss:
  # C1 is the missing RF-specific analogue of the successful YOLO Step-3:
  # only UGCA learns; detector, Bridge and SAM-H remain immutable.
  lambda_det: 0.0
  lambda_seg: 0.0
  lambda_ugca: 0.25
  ugca_quality_ranking_loss_weight: 0.0

train:
  flow: warmup_joint
  joint_training_mode: ugca_only
  train_student_decoder_in_joint: false
  # 16 epochs bounds the complete C0-C3 sequence near the unattended 12-hour
  # window at the measured ~36 min/epoch; validation can stop after epoch 10.
  joint_epochs: 16
  joint_world_size_per_split: 4
  batch_size_per_gpu: 2
  # This field is global accumulation; on four ranks it is local accumulation 1.
  gradient_accumulation: 4
  learning_rates:
    joint_ugca: 1.0e-5

validation:
  initialize_joint_best_from_parent: true
  early_stopping:
    joint: {enabled: true, min_epochs: 10, patience: 4, min_delta: 0.001}

runtime:
  num_workers: 8
  instance_chunk_size: 8
  inference_instance_chunk_size: 16
