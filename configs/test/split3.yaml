server:
  hostname: user-host
  scheduler: none
  gpu_model: NVIDIA Tesla V100
  gpu_count_per_node: 4
  cpu_count: 56
  ram_gb: 503
  scratch_root: ./.scratch
  project_root: .
paths:
  pannuke_raw: data/pannuke/raw
  pannuke_prepared: data/pannuke/prepared
  yolo_generic_weight: data/pannuke/prepared/weights/yolo26x.pt
  sam_vit_b_weight: weights/pretrained/sam_vit_b_01ec64.pth
  yolo_stage1_root: data/pannuke/prepared/runs/yolo26_comparison_2gpu_300e_es50/train/yolo26x
  ultralytics_repo: third_party/ultralytics
  segment_anything_repo: third_party/segment-anything
  pannuke_metrics_repo: third_party/PanNuke-metrics
  outputs: ./outputs
runtime:
  python: python
  cuda_visible_devices: 0,1,2,3
  use_bf16: false
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  instance_chunk_size: 8
  inference_instance_chunk_size: 16
_meta:
  resolved_from: ./outputs/rfdetr_class_aware_review/split3/decision/calibrated_config.yaml
dataset: pannuke
raw_root: data/pannuke/raw
prepared_root: data/pannuke/prepared
discovery_manifest: ./data/manifests/discovered_raw.json
all_samples_manifest: ./data/manifests/all_samples.jsonl
num_classes: 5
class_names:
- neoplastic
- inflammatory
- connective
- dead
- epithelial
background_channel: 5
image_size:
- 256
- 256
seed: 42
fold_rotations:
  1:
    train:
    - 1
    validation:
    - 2
    test:
    - 3
  2:
    train:
    - 2
    validation:
    - 3
    test:
    - 1
  3:
    train:
    - 3
    validation:
    - 1
    test:
    - 2
detector:
  architecture: rfdetr_2xlarge
  num_classes: 5
  imgsz: 880
  native_detector_mode: true
  dfc_coupled_mode: false
  use_one2one: true
  use_box_nms: false
  resize_antialias: false
  frozen_in_dfc_sam: true
  feature_sources:
  - dino_shallow
  - dino_deep
  - projected_p4
  class_probability_mode: sigmoid
sam:
  variant: vit_h
  input_size: 1024
  embed_dim: 256
  embed_hw:
  - 64
  - 64
  upscaled_dim: 32
  freeze_image_encoder: true
  student_uses_prompt_encoder: false
  multimask_output: false
bridge:
  use_saa: true
  projection_norm: group_norm
  projection_activation: silu
  group_norm_groups: 32
  semantic_hidden_dim: 256
  gate_transition_cells: 0.5
  architecture: rfdetr_multi_depth_saa
ugca:
  enabled: true
  grid_hw:
  - 14
  - 14
  attention_dim: 256
  num_heads: 8
  dropout: 0.0
  detach_morphology: true
  detach_boxes: true
  detach_entropy: true
  use_mask_attention_bias: false
  variant: quality_aware_v3
  gate_hidden_dim: 64
  residual_logit_cap: 1.0
  quality_hidden_dim: 64
  hard_negative_ratio: 1.0
  hard_negative_max_per_image: 32
  hard_negative_score_threshold: 0.05
experiment:
  name: rfdetr_2xlarge_sam_h_ugca_v3_split3
  protocol: pannuke_standard_3fold
  split_id: 3
  seed: 42
  status: formal_frozen
weights:
  yolo_generic: data/pannuke/prepared/weights/yolo26x.pt
  sam_vit_b: weights/pretrained/sam_vit_b_01ec64.pth
  detector_stage1: ./outputs/rfdetr_stage1_sequence/split3/rfdetr_2xlarge_best.pth
  teacher_stage2a: null
  quality_calibration: null
  warmup_stage2: ./outputs/rfdetr_dfc_sam/sam_h_split3/warmup/best.pt
  pseudo_bank: null
  sam_vit_h: weights/pretrained/sam_vit_h_4b8939.pth
supervision:
  mode: full
  strategy: full
  mask_ratio: 1.0
  manifest: null
  use_teacher: false
  use_pseudo_bank: false
  use_qwpm: false
  teacher_multimask_k: 3
  mask_threshold: 0.5
  stability_delta: 0.05
  quality_threshold: 0.5
initialization:
  detector: detector_stage1
  student_sam: generic_sam_vit_h
  student_decoder: generic_sam_vit_h
loss:
  mask_loss_resolution: low_res_256
  lambda_det: 0.0
  lambda_seg: 0.0
  lambda_ugca: 0.25
  dice_epsilon: 1.0e-06
  ugca_class_weights:
  - 0.455288
  - 0.727983
  - 0.584586
  - 2.424222
  - 0.80792
  ugca_label_smoothing: 0.05
  ugca_loss_normalization: per_image
  ugca_gate_loss_weight: 0.25
  ugca_preservation_loss_weight: 0.5
  ugca_quality_loss_weight: 1.0
  ugca_quality_mask_threshold: 0.5
  ugca_quality_ranking_loss_weight: 0.0
  ugca_quality_ranking_min_target_gap: 0.1
  ugca_quality_ranking_margin: 0.2
train:
  flow: warmup_joint
  train_student_decoder_in_joint: false
  teacher_epochs: 50
  warmup_epochs: 30
  joint_epochs: 16
  batch_size_per_gpu: 2
  gradient_accumulation: 4
  optimizer: adamw
  scheduler: cosine
  minimum_lr_ratio: 0.01
  learning_rates:
    teacher_decoder: 1.0e-05
    bridge: 5.0e-05
    student_decoder: 1.0e-05
    detector: 2.0e-06
    ugca: 1.0e-05
    warmup_bridge: 5.0e-05
    warmup_student_decoder: 1.0e-05
    detector_head: 2.0e-06
    joint_bridge: 1.0e-05
    joint_student_decoder: 2.0e-06
    joint_ugca: 1.0e-05
    joint_ugca_shared: 5.0e-07
    joint_ugca_quality: 2.0e-06
  weight_decay: 0.0001
  amp: true
  amp_dtype: fp16
  amp_initial_scale: 1024.0
  amp_backoff_retries: 5
  deterministic: true
  resume: null
  checkpoint_interval_epochs: 10
  joint_detector_scope: all
  warmup_world_size_per_split: 4
  joint_world_size_per_split: 4
  joint_training_mode: ugca_only
validation:
  interval_epochs: 1
  checkpoint_metric: mpq
  tie_break_metric: bpq
  defer_test_freeze_until_threshold_calibration: true
  early_stopping:
    warmup:
      enabled: true
      min_epochs: 12
      patience: 6
      min_delta: 0.001
    joint:
      enabled: true
      min_epochs: 10
      patience: 4
      min_delta: 0.001
  initialize_joint_best_from_parent: true
inference:
  pre_threshold: 0.35
  max_instances: 400
  mask_threshold: 0.45
  final_score_threshold: 0.35
  use_box_nms: false
  use_mask_nms: false
  logit_blend: 1.0
  quality_power: 0.25
  tta:
    enabled: false
    views:
    - identity
    view_count: 1
evaluation:
  official_metrics_repo: third_party/PanNuke-metrics
  official_metrics_commit: c00014d766ca1be142b81bea19d9ef4315cde65a
  pq_match_iou: 0.5
  report_by_class: true
  report_by_tissue: true
  save_raw_instances: true
  save_official_arrays: true
augmentation:
  train_color:
    enabled: true
    probability: 0.8
    stain_strength: 0.15
    brightness_strength: 0.1
